<!DOCTYPE html>

        /* --- MAIN CONTAINER & NEON STROKE --- */

    <script>
        // --- SECRET INFO ---
        const MAGIC_WORD = "Alohomora";
        
        // CẬP NHẬT 2 CHUỖI NÀY BẰNG KẾT QUẢ TỪ file generator.html
        const ENCRYPTED_VIETNAMESE_CV_URL = "ZRGkdAuH5ZolEjuenhYVjZly6OEhGSaixYv1rzZz/YCann9/eipa8VlGFhEGzZpFA/KCmq7wbIWEi7e1PWnGrv2hPn6yJcIUeAin1gteoBU="; 
        const ENCRYPTED_ENGLISH_CV_URL = "pP+qpZb3ma3GlQkmZaY9lePqX6fUnCo20xWvoIBM3PpoQU/AMxDp+gHga5tKtyi7QKK4fD8AA0JABj3rz4DSaD7NVFdnjM7qRCNSkcTtlG0=";

        const LOTTIE_ROBOT_URL = 'https://lottie.host/8e20f269-a1b4-49c6-8f3e-87f54070a927/xR3M6R6GjP.json'; // Robot/Bot
        const LOTTIE_DOOR_URL = 'https://lottie.host/9c20a89d-6523-455b-b9f1-a12884b25e24/qX9Yh4r6N8.json'; // Gate/Door

        const MESSAGE_ELEM = document.getElementById('message');

    const MAGIC_OVERLAY = document.getElementById('magicOverlay');
        
        let doorAnimation;

        /**

        function initLottie() {
            lottie.loadAnimation({

        /**
         * Khởi tạo GSAP UI Animation
         */
        function initGsap() {
            gsap.fromTo("#mainContainer", {
                y: 50,
                opacity: 0,
                scale: 0.95
            }, {
                duration: 1.5,
                y: 0,
                opacity: 1,
                scale: 1,
                ease: "power3.out"
            });
            gsap.fromTo("h1, h2, .language-selection, .input-group", {
                opacity: 0
            }, {
                opacity: 1,
                duration: 0.8,
                delay: 1.2,
                stagger: 0.2
            });
        }
        
        /**
         * Chuyển Base64 string thành ArrayBuffer
         */
        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /**
         * Hàm giải mã AES-128-CBC (Logic cốt lõi)
         */
        async function decryptUrl(encryptedBase64, secretKey) {
            try {
                const encryptedBuffer = base64ToArrayBuffer(encryptedBase64);
                const IV_LENGTH = 16;
                if (encryptedBuffer.byteLength < IV_LENGTH) return null;

                const keyMaterial = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secretKey));
                const aesKeyBuffer = keyMaterial.slice(0, 16); 
                const iv = new Uint8Array(encryptedBuffer.slice(0, IV_LENGTH)); 
                const encryptedData = encryptedBuffer.slice(IV_LENGTH); 

                const aesKey = await crypto.subtle.importKey(
                    'raw',
                    aesKeyBuffer,
                    { name: 'AES-CBC' },
                    false,
                    ['decrypt']
                );

                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-CBC', iv: iv },
                    aesKey,
                    encryptedData
                );

                const url = new TextDecoder().decode(decryptedBuffer).trim();
                return url.replace(/\0/g, ''); 
                
            } catch (error) {
                console.error("❌ Decryption failed. Final check failed.", error);
                return null; 
            }
        }

        /**
         * Xử lý sự kiện nhấn nút "Open Door"
         */
        async function handleOpenDoor() {
            MESSAGE_ELEM.textContent = '';
            OPEN_BTN.disabled = true;
            
            const inputWord = INPUT_WORD.value.trim();

            if (inputWord !== MAGIC_WORD) {
                MESSAGE_ELEM.textContent = '❌ Incorrect magic word. Access denied.';
                OPEN_BTN.disabled = false;
                return;
            }

            MESSAGE_ELEM.textContent = '🔑 Decoding sequence initiated...';

            const lang = document.querySelector('input[name="language"]:checked').value;
            const encryptedUrl = lang === 'vietnamese' ? ENCRYPTED_VIETNAMESE_CV_URL : ENCRYPTED_ENGLISH_CV_URL;

            const decryptedUrl = await decryptUrl(encryptedUrl, MAGIC_WORD);

            if (decryptedUrl) {
                MESSAGE_ELEM.textContent = '✅ Success! Opening portal...';
                
                // Play the door Lottie open animation immediately
                doorAnimation.play();

                // small robot flourish
                const robotEl = document.getElementById('robot-lottie');
                if (robotEl) {
                    robotEl.style.transform = 'translateY(-18px) rotate(-6deg) scale(1.06)';
                    setTimeout(() => robotEl.style.transform = '', 900);
                }

                // Magic overlay burst (radial pulse) and zoom-out container
                gsap.set(MAGIC_OVERLAY, {opacity: 1, scale: 0.2});
                gsap.to(MAGIC_OVERLAY, {scale: 3.2, opacity: 0, duration: 1.0, ease: "power4.out"});

                // Short delay so the overlay and door start together, then zoom container out
                gsap.to("#mainContainer", {
                    opacity: 0,
                    y: -80,
                    scale: 0.58,
                    duration: 1.0,
                    delay: 0.15,
                    ease: "power2.in",
                    onComplete: () => {
                        // Redirect after animation completes
                        window.location.href = decryptedUrl;
                    }
                });

            } else {
                MESSAGE_ELEM.textContent = '⚠️ Decryption failed. The magic is broken.';
                OPEN_BTN.disabled = false;
                doorAnimation.goToAndStop(0, true); // Reset door to closed
            }
        }

        // --- Event Listeners and Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initLottie();
            initGsap();
        });

        OPEN_BTN.addEventListener('click', handleOpenDoor);
        INPUT_WORD.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleOpenDoor();
            }
        });
        DOOR_CONTAINER.addEventListener('click', handleOpenDoor); // Có thể nhấn vào cửa
    </script>
</body>
