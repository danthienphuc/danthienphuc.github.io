<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Welcome to Daniel World</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a1a;
            color: #f0f0f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Scene Container */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Magic Circle - rotation animation */
        .magic img {
            position: absolute;
            top: 30vw;
            left: 50%;
            width: 60vw;
            animation: rotateMagicCircle 10s linear infinite;
            z-index: 2;
        }

        @keyframes rotateMagicCircle {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* 1. Doors (Bottom Layer) */
        .door {
            /* display: none; */
            margin: 14%;
            position: absolute;
            top: 0;
            z-index: 2;
        }
        
        .door img {
            width: 30vw;
        }

        

        #robot-lottie {
            z-index: 5;
            /* set position */
            left: 20vw;
            bottom: 10vh;
            position: absolute;
            width: 180px;
            opacity: 0; /* start hidden for intro animation */
        }

        
        @media (max-aspect-ratio: 1) {

            .magic img {
                top: 30vh;
                width: 50vh;
            }
            
            .door {
                margin: 15vh;
            }

            .door img {
                width: 32vh;
            }
            #robot-lottie {
                left: 30vh;
                bottom: 30vh;
            }
        }


        #left-door {
            transform-origin: left center;
        }
        
        
        #right-door {
            transform-origin: right center;
        }

        /* 2. Portal (Starts hidden, behind doors) */
        #portal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1px;
            height: 1px;
            background: radial-gradient(circle, #f197ff, #00ffff, #ffffff, #ffffff00 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1; /* Phía sau cửa */
            opacity: 0;
        }

        /* 3. Background Frame (On top of doors) */
        #background-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            z-index: 3;
            pointer-events: none; /* Cho phép click xuyên qua */
        }

        /* 4. UI (Top Layer) */
        #ui-container {
            position: absolute;
            bottom: 5vh;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            background: rgba(10, 10, 30, 0.75);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            opacity: 0; /* start hidden for intro */
        }

        #message {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .input-group {
            display: flex;
            width: 100%;
            max-width: 350px;
            margin-bottom: 0.5rem;
        }

        #magicWord {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            border-radius: 8px 0 0 8px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        #magicWord:focus {
            border-color: #8a2be2;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        #openDoorBtn {
            padding: 0.75rem 1.25rem;
            border: none;
            background: #8a2be2;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        #openDoorBtn:hover {
            background: #7b24c6;
        }
        
        #openDoorBtn:active {
            transform: scale(0.98);
        }
        
        #openDoorBtn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .language-selection {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.25rem;
            width: 100%;
        }

        .language-selection label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #status-message {
            height: 1.2em;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #status-message.error {
            color: #ff6b6b;
        }
        
        #status-message.success {
            color: #51ffb8;
        }

        /* initial hidden state for intro elements */
        #ui-container h2,
        #ui-container h3,
        .language-selection,
        .input-group,
        #status-message {
            opacity: 0;
        }

        /* Loading overlay shown while assets initialize */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            background: radial-gradient(circle at 50% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 40%, rgba(10,0,20,0.95) 100%);
            backdrop-filter: blur(6px) saturate(1.1);
            pointer-events: none;
        }
        .loader {
            text-align: center;
            color: #f0f0f0;
        }
        .loader-circle {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,234,255,0.12), inset 0 0 12px rgba(138,43,226,0.14);
            margin: 0 auto;
            filter: drop-shadow(0 0 8px rgba(0,234,255,0.12));
            animation: loader-spin 1.45s linear infinite;
        }
        @keyframes loader-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loader-text {
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: #f0f0f0;
            text-shadow: 0 0 8px rgba(0,234,255,0.06);
        }

    </style>
</head>
<body>
    
    <!-- Loading overlay shown until intro animation starts -->
    <div id="loadingOverlay">
        <div class="loader">
            <div class="loader-circle" aria-hidden="true"></div>
            <div class="loader-text">Connecting to the magic portal...</div>
        </div>
    </div>

    <div id="scene">
        <div class="magic">
            <img src="./assets/magic-circle.jpg" alt="magic circle">
        </div>

        <div id="left-door" class="door">
            <img src="./assets/left-door.png" alt="Left Door">
        </div>
        <div id="right-door" class="door">
            <img src="./assets/right-door.png" alt="Right Door">
        </div>

        <div id="portal"></div>

        <img id="background-frame" src="./assets/daniel-space.png" alt="Daniel Space">

            <lottie-player id="robot-lottie"
                src="./assets/robot_greeting.json"
                background="transparent"
                speed="1"
                style="width: 180px; height: 180px; margin-bottom: -20px;"
                loop
                autoplay
                aria-hidden="true"
            ></lottie-player>

            <div id="ui-container">
            <h2 id="message">Please speak your magic words to open the door.</h2>
            
            <div class="language-selection">
                <label>
                    <input type="radio" name="language" value="vietnamese" checked>
                    Tiếng Việt
                </label>
                <label>
                    <input type="radio" name="language" value="english">
                    English
                </label>
            </div>

            <div class="input-group">
                <input type="password" id="magicWord" placeholder="Magic words...">
                <button id="openDoorBtn">Open</button>
            </div>
            
            <div id="status-message">If you don't know the magic words, please ask Daniel.</div>
        </div>
    </div>

    <script>
        // CÁC CHUỖI MÃ HÓA TỪ FILE CỦA BẠN
        const ENCRYPTED_VIETNAMESE_CV_URL = "ZRGkdAuH5ZolEjuenhYVjZly6OEhGSaixYv1rzZz/YCann9/eipa8VlGFhEGzZpFA/KCmq7wbIWEi7e1PWnGrv2hPn6yJcIUeAin1gteoBU="; 
        const ENCRYPTED_ENGLISH_CV_URL = "pP+qpZb3ma3GlQkmZaY9lePqX6fUnCo20xWvoIBM3PpoQU/AMxDp+gHga5tKtyi7QKK4fD8AA0JABj3rz4DSaD7NVFdnjM7qRCNSkcTtlG0="; 

        // DOM Elements
        const STATUS_ELEM = document.getElementById('status-message');
        const INPUT_WORD = document.getElementById('magicWord');
        const OPEN_BTN = document.getElementById('openDoorBtn');
        const UI_CONTAINER = document.getElementById('ui-container');
        const LEFT_DOOR = document.getElementById('left-door');
        const RIGHT_DOOR = document.getElementById('right-door');
        const PORTAL = document.getElementById('portal');
        const ROBOT_CONTAINER = document.getElementById('robot-lottie');

        
        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }

        async function decryptUrl(encryptedBase64, secretKey) {
            try {
                const encryptedBuffer = base64ToArrayBuffer(encryptedBase64);
                const IV_LENGTH = 16;
                if (encryptedBuffer.byteLength < IV_LENGTH) return null;

                const keyMaterial = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secretKey));
                const aesKeyBuffer = keyMaterial.slice(0, 16); 
                const iv = new Uint8Array(encryptedBuffer.slice(0, IV_LENGTH)); 
                const encryptedData = encryptedBuffer.slice(IV_LENGTH); 

                const aesKey = await crypto.subtle.importKey(
                    'raw',
                    aesKeyBuffer,
                    { name: 'AES-CBC' },
                    false,
                    ['decrypt']
                );

                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-CBC', iv: iv },
                    aesKey,
                    encryptedData
                );

                const url = new TextDecoder().decode(decryptedBuffer).trim();
                return url.replace(/\0/g, ''); 
                
            } catch (error) {
                console.error("❌ Decryption failed.", error);
                return null; 
            }
        }

        /**
         * Xử lý sự kiện nhấn nút "Open"
         */
        async function handleOpenDoor() {
            STATUS_ELEM.textContent = '';
            STATUS_ELEM.className = '';
            OPEN_BTN.disabled = true;

            const inputWord = INPUT_WORD.value.trim();

            if (!inputWord) {
                STATUS_ELEM.textContent = '❌ Please enter the magic words.';
                STATUS_ELEM.className = 'error';
                try { STATUS_ELEM.style.opacity = '1'; } catch (e) {}
                gsap.fromTo(STATUS_ELEM, { y: 0, scale: 1 }, { y: -6, scale: 1.02, duration: 0.18, yoyo: true, repeat: 1, ease: 'power1.inOut' });
                OPEN_BTN.disabled = false;
                return;
            }

            STATUS_ELEM.textContent = '🔑 Decoding sequence initiated...';
            STATUS_ELEM.className = '';

            const lang = document.querySelector('input[name="language"]:checked').value;
            const encryptedUrl = lang === 'vietnamese' ? ENCRYPTED_VIETNAMESE_CV_URL : ENCRYPTED_ENGLISH_CV_URL;

            // Try to decrypt with the user-provided passphrase. We consider the
            // magic word correct if decryption yields a URL starting with http/https.
            let decryptedUrl = null;
            try {
                decryptedUrl = await decryptUrl(encryptedUrl, inputWord);
            } catch (e) {
                console.error('Decryption threw:', e);
                decryptedUrl = null;
            }

            if (decryptedUrl && /^https?:\/\//i.test(decryptedUrl)) {
                STATUS_ELEM.textContent = '✅ Success! Opening portal...';
                try { STATUS_ELEM.style.opacity = '1'; } catch (e) {}

                // --- BẮT ĐẦU ANIMATION MỞ CỬA BẰNG GSAP ---
                const tl = gsap.timeline();

                // 1. Ẩn UI
                tl.to(UI_CONTAINER, {
                    opacity: 0,
                    y: 50,
                    duration: 0.5,
                    ease: "power2.in"
                });

                // 2. Mở 2 cánh cửa (dùng xPercent để chắc chắn)
                tl.to(LEFT_DOOR, {
                    xPercent: -100,
                    duration: 2.0,
                    ease: "power3.inOut"
                }, ">");
                
                tl.to(RIGHT_DOOR, {
                    xPercent: 100,
                    duration: 2.0,
                    ease: "power3.inOut"
                }, "<");

                // 3. Hiển thị và phóng to portal từ giữa
                tl.set(PORTAL, { 
                    zIndex: 99,
                    opacity: 0.3 
                });
                
                tl.to(PORTAL, {
                    opacity: 1,
                    scale: 2000,
                    duration: 2.5,
                    color: "#ffffff",
                    ease: "power2.in",
                    onComplete: () => {
                        // Redirect to the decrypted URL
                        window.location.href = decryptedUrl;
                    }
                }, "-=1.5");

            } else {
                STATUS_ELEM.textContent = '❌ Incorrect magic word or decryption failed.';
                STATUS_ELEM.className = 'error';
                try { STATUS_ELEM.style.opacity = '1'; } catch (e) {}
                OPEN_BTN.disabled = false;
                // small attention animation for the status message
                gsap.fromTo(STATUS_ELEM, { y: 0, scale: 1 }, { y: -6, scale: 1.02, duration: 0.18, yoyo: true, repeat: 1, ease: 'power1.inOut' });
                // Animation lắc UI
                gsap.fromTo(UI_CONTAINER, { x: 0 }, {
                    x: 10, duration: 0.05, repeat: 5, yoyo: true, clearProps: "x"
                });
            }
        }
        // --- Event Listeners and Initialization ---
        /**
         * Run the intro animation sequence: hide loader, reveal UI elements
         */
        function runIntro() {
            const loading = document.getElementById('loadingOverlay');
            const tl = gsap.timeline();

            // fade out loader
            tl.to(loading, { opacity: 0, scale: 0.98, duration: 0.6, ease: "power2.inOut", onComplete: () => {
                if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
            }});

            // reveal UI container with a gentle pop and slide
            tl.fromTo("#ui-container", { y: 30, scale: 0.98, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1.5, ease: "power3.out" }, "-=0.15");

            // robot and text stagger
            tl.to("#robot-lottie", { opacity: 1, y: -8, duration: 0.6, ease: "power3.out" }, "-=0.7");
            tl.to("#ui-container h2, #ui-container h3", { opacity: 1, duration: 0.5 }, "-=0.5");
            tl.to(".language-selection", { opacity: 1, duration: 0.35 }, "-=0.35");
            tl.to(".input-group", { opacity: 1, duration: 0.35 }, "-=0.3");
            tl.to("#status-message", { opacity: 1, duration: 0.35 }, "-=0.25");
        }

        document.addEventListener('DOMContentLoaded', () => {
            // small delay for lottie-player to initialize and for first paint; then run the intro
            setTimeout(() => runIntro(), 520);
        });

        OPEN_BTN.addEventListener('click', handleOpenDoor);
        INPUT_WORD.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleOpenDoor();
            }
        });
    </script>
</body>
</html>
